<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="build-version" content="__BUILD_VERSION__">
  <meta name="author" content="Niagova">
  <title>Dental Clinic Template Showcase</title>
  <meta name="description" content="Compare three Dental Clinic website concepts in one showcase: Clean, Modern and Premium.">
  <meta name="theme-color" content="#f4fbfc">
  <meta property="og:title" content="Dental Clinic Template Showcase">
  <meta property="og:image" content="01-clean/images/clinic-hero-generations-v4.webp">
  <link rel="canonical" href="https://demo-dental.niagova.com/">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="index.css?v=__BUILD_VERSION__">
</head>
<body>
  <a class="skip-link" href="#templatePreview">Skip to website preview</a>

  <header class="showcase-bar" aria-label="Template preview controls">
    <div class="showcase-identity">
      <a class="showcase-logo" href="https://niagova.com/" target="_blank" rel="noopener"><img src="assets/niagova-logo.svg" alt="Niagova" width="118" height="28"></a>
      <span class="showcase-title">
        <strong>Dental Clinic concepts</strong>
        <small><span>Demo by Niagova</span> · <span id="previewStatus" aria-live="polite">Previewing Clean</span></small>
      </span>
    </div>

    <nav class="template-tabs" aria-label="Choose a website template">
      <button class="template-tab" type="button" data-template="clean" aria-pressed="true"><span>01</span> Clean</button>
      <button class="template-tab" type="button" data-template="modern" aria-pressed="false"><span>02</span> Modern</button>
      <button class="template-tab" type="button" data-template="premium" aria-pressed="false"><span>03</span> Premium</button>
    </nav>

    <div class="showcase-actions">
      <a class="open-template" id="openTemplate" href="01-clean/index.html" target="_blank" rel="noopener" aria-label="Open this template as a full page in a new tab">
        <span class="open-label">Open full page</span> <span aria-hidden="true">↗</span>
      </a>
      <a class="view-packages" href="https://niagova.com/#pricing" target="_blank" rel="noopener">View packages</a>
    </div>
  </header>

  <main class="preview-shell">
    <iframe id="templatePreview" name="templatePreview" src="01-clean/index.html" title="Clean dental clinic website template preview"></iframe>
  </main>

  <noscript>
    <div class="no-script">
      JavaScript is needed for the template switcher. Open a template directly:
      <a href="01-clean/index.html">Clean</a>,
      <a href="02-modern/index.html">Modern</a> or
      <a href="03-premium/index.html">Premium</a>.
    </div>
  </noscript>

  <script src="index.js?v=__BUILD_VERSION__"></script>
</body>
</html>
